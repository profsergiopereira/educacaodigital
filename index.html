<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prof Sergio Digital</title>
    <style>
        body { margin: 0; padding: 0; background: #051622; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .base { position: relative; width: 90vw; max-width: 85vh; margin: auto; }
        
        /* Camada 1: Fundo */
        .capa { width: 100%; border-radius: 20px; display: block; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; z-index: 10; }
        
        /* Camada 2: Áreas de clique invisíveis */
        #cabeca-click { position: absolute; top: 15%; left: 25%; width: 50%; height: 35%; z-index: 100; cursor: pointer; }
        .social-link { position: absolute; bottom: 5%; width: 18%; height: 15%; z-index: 200; cursor: pointer; }
        #yt { left: 20%; } #ig { left: 41%; } #gh { left: 62%; }

        /* Camada 3: Agrinho (Sempre no topo) */
        #agro { 
            position: absolute; top: -5%; right: -2%; width: 28%; max-width: 130px; 
            z-index: 3000; cursor: pointer; animation: bounce 3s ease-in-out infinite; 
            -webkit-tap-highlight-color: transparent; 
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* Camada 4: Player de Vídeo (Cobre tudo quando ativo) */
        #videoPrincipal { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 100%; height: auto; max-height: 100vh; border-radius: 15px; 
            display: none; z-index: 4000; background: #000; 
        }

        @media (min-width: 1024px) { .base { width: 50vw; } }
    </style>
</head>

        <a href="https://github.com/profsergiopereira" target="_blank" class="social-link" id="gh"></a>
    </div>
