<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prof Sergio Digital</title>
    <style>
        body { margin: 0; padding: 0; background: #051622; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .base { position: relative; width: 90vw; max-width: 85vh; margin: auto; }
        
        /* Fundo - Bloqueamos cliques no fundo para não atrapalhar os botões */
        .capa { width: 100%; border-radius: 20px; display: block; position: relative; z-index: 1; pointer-events: none; }
        
        /* Botão Agrinho - Z-INDEX 9999 (O mais alto de todos) */
        #agro { 
            position: absolute; top: -5%; right: -2%; width: 28%; max-width: 130px; 
            z-index: 9999; cursor: pointer; animation: bounce 3s ease-in-out infinite; 
            -webkit-tap-highlight-color: transparent; pointer-events: auto;
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* Áreas de clique (Cabeça e Redes) - Z-INDEX 5000 */
        #cabeca-click { position: absolute; top: 15%; left: 25%; width: 50%; height: 35%; z-index: 5000; cursor: pointer; pointer-events: auto; }
        .social-link { position: absolute; bottom: 5%; width: 18%; height: 15%; z-index: 5000; cursor: pointer; pointer-events: auto; }
        #yt { left: 20%; } #ig { left: 41%; } #gh { left: 62%; }

        /* Player de Vídeo - Cobre tudo quando abre */
        #videoPrincipal { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 100%; height: auto; max-height: 100vh; border-radius: 15px; 
            display: none; z-index: 10000; background: #000; 
        }
    </style>
</head>
<body onclick="iniciarSom()">

    <audio id="bgMusic" loop>
        <source src="musica-tema.mp3" type="audio/mpeg">
    </audio>

    <div class="base">
        <img src="logo.jpg" class="capa">
        
        <img src="agrinho.png" id="agro" onclick="abrirVideo('video-agrinho.mp4', true)">
        
        <video id="videoPrincipal" playsinline onclick="fechar()"></video>

        <div id="cabeca-click" onclick="abrirVideo('seu-video.mp4', false)"></div>

        <a href="https://www.youtube.com" target="_blank" class="social-link" id="yt"></a>
        <a href="https://instagram.com/prof.sergiopereira" target="_blank" class="social-link" id="ig"></a>
        <a href="https://github.com/profsergiopereira" target="_blank" class="social-link" id="gh"></a>
    </div>

    <script>
        const som = document.getElementById('bgMusic');
        const vid = document.getElementById('videoPrincipal');
        const btnAgro = document.getElementById('agro');
        let somLigado = false;

        // Tenta iniciar a música suavemente
        function iniciarSom() {
            if (!somLigado) {
                som.volume = 0.045;
                som.play().then(() => { somLigado = true; }).catch(() => {});
            }
        }

        function abrirVideo(link, sumirAgro) {
            iniciarSom(); // Destrava o som no clique
            try { som.pause(); } catch(e) {}

            if (sumirAgro) {
                btnAgro.style.visibility = 'hidden';
                setTimeout(() => { btnAgro.style.visibility = 'visible'; }, 60000);
            }

            vid.src = link;
            vid.style.display = 'block';
            vid.play().catch(() => {
                vid.muted = true;
                vid.play();
            });
        }

        function fechar() {
            vid.pause();
            vid.style.display = 'none';
            vid.src = "";
            if (somLigado) { try { som.play(); } catch(e) {} }
        }

        vid.onended = fechar;
    </script>
</body>
</html>
