<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prof Sergio Digital</title>
    <style>
        body { margin: 0; padding: 0; background: #051622; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .base { position: relative; width: 90vw; max-width: 85vh; margin: auto; }
        
        /* Capa */
        .capa { width: 100%; border-radius: 20px; display: block; position: relative; z-index: 5; }
        
        /* Botão Agrinho - Colocado na camada 99999 */
        #agro { 
            position: absolute; top: -5%; right: -2%; width: 28%; max-width: 130px; 
            z-index: 99999; cursor: pointer; animation: bounce 3s ease-in-out infinite; 
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* Áreas de clique - Ampliadas para facilitar o toque no celular */
        #cabeca-click { 
            position: absolute; top: 10%; left: 20%; width: 60%; height: 45%; 
            z-index: 88888; cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        
        .social-link { position: absolute; bottom: 5%; width: 18%; height: 15%; z-index: 88888; cursor: pointer; }
        #yt { left: 20%; } #ig { left: 41%; } #gh { left: 62%; }

        /* Player de Vídeo - Sempre na frente de tudo quando abre */
        #videoPrincipal { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 100%; height: auto; max-height: 100vh; border-radius: 15px; 
            display: none; z-index: 100000; background: #000; 
        }
    </style>
</head>
<body>

    <div class="base">
        <img src="logo.jpg" class="capa">
        
        <img src="agrinho.png" id="agro" onclick="abrirVideo('video-agrinho.mp4', true)">
        
        <div id="cabeca-click" onclick="abrirVideo('seu-video.mp4', false)"></div>

        <a href="https://www.youtube.com" target="_blank" class="social-link" id="yt"></a>
        <a href="https://instagram.com/prof.sergiopereira" target="_blank" class="social-link" id="ig"></a>
        <a href="https://github.com/profsergiopereira" target="_blank" class="social-link" id="gh"></a>
