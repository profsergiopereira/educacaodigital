<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prof Sergio Educação Digital</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #051622;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; width: 100vw; overflow: hidden;
        }

        .container {
            position: relative;
            max-width: 95vw;
            max-height: 90vh;
        }

        .img-base {
            width: auto; height: auto;
            max-width: 100%; max-height: 90vh;
            border-radius: 15px; display: block;
            position: relative;
            z-index: 10; /* A imagem fica na frente */
        }

        #video-feed {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; border-radius: 15px;
            z-index: 5; /* O vídeo começa atrás da imagem */
        }

        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 100; /* O botão de clique está sempre no topo de tudo */
            opacity: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* Área da cabeça maior para garantir o clique no telemóvel */
        #btn-cabelo { top: 15%; left: 30%; width: 40%; height: 40%; }
        
        .social-btn { bottom: 5%; width: 15%; height: 15%; }
        #youtube { left: 25%; }
        #instagram { left: 42%; }
        #github { left: 59%; }
    </style>
</head>
<body>

    <div class="container">
        <video id="video-feed" muted playsinline preload="auto">
            <source src="seu-video.mp4" type="video/mp4">
        </video>

        <img src="logo.jpg" alt="Prof Sergio" class="img-base" id="foto-sergio">

        <div class="hotspot" id="btn-cabelo" onclick="reproduzir()"></div>

        <a href="https://www.youtube.com/@osergiopereira" target="_blank" class="hotspot social-btn" id="youtube"></a>
        <a href="https://www.instagram.com/prof.sergiopereira" target="_blank" class="hotspot social-btn" id="instagram"></a>
        <a href="https://github.com/profsergiopereira" target="_blank" class="hotspot social-btn" id="github"></a>
    </div>

    <script>
        const v = document.getElementById('video-feed');
        const btn = document.getElementById('btn-cabelo');

        function reproduzir() {
            // 1. Traz o vídeo para a frente de tudo
            v.style.zIndex = "200";
            v.currentTime = 0;
            
            // 2. Tenta dar play
            var promise = v.play();

            if (promise !== undefined) {
                promise.catch(error => {
                    console.log("Autoplay bloqueado, tentando forçar...");
                    v.play();
                });
            }
        }

        function voltarAoInicio() {
            // Manda o vídeo para trás da imagem de novo
            v.style.zIndex = "5";
            v.pause();
            v.currentTime = 0;
        }

        // QUANDO O VÍDEO ACABAR: Volta para a imagem inicial automaticamente
        v.addEventListener('ended', function() {
            voltarAoInicio();
        });

        // Se clicar no vídeo enquanto ele roda, ele também volta para a foto
        v.onclick = function() {
            voltarAoInicio();
        };
    </script>

</body>
</html>
