<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prof Sergio Educação Digital</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #051622; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden;
        }

        /* O segredo: o container acompanha o tamanho real da imagem exibida */
        .interface-wrapper { 
            position: relative; 
            max-width: 100%;
            max-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .img-base { 
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            display: block; 
            object-fit: contain;
        }

        #video-feed { 
            position: absolute; 
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0; 
            z-index: 10; 
            pointer-events: none; 
            transition: opacity 0.5s ease; 
        }

        /* Botões */
        .hotspot { 
            position: absolute; 
            cursor: pointer; 
            z-index: 100; 
            opacity: 0; 
            transition: opacity 0.4s; 
            outline: none; 
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Brilho ao tocar/passar o mouse */
        .hotspot:hover, .hotspot:active { opacity: 1; }

        /* --- POSIÇÕES PRECISAS (Ajustadas para a cabeça) --- */
        #btn-cabelo { 
            top: 25%;           /* 25% do topo da imagem */
            left: 38%;          /* Centralizado horizontalmente */
            width: 25%;         /* Área de clique maior */
            height: 25%;        
            border-radius: 50%; 
            background: radial-gradient(circle, rgba(255, 215, 0, 0.4) 0%, rgba(255, 215, 0, 0) 70%);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.5);
        }

        .
