<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prof Sergio Educação Digital</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #051622;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            position: relative;
            line-height: 0;
            max-width: 95vw;
        }

        .img-base {
            width: 100%;
            height: auto;
            max-height: 90vh;
            border-radius: 15px;
            display: block;
        }

        #video-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            display: none;
            z-index: 5;
        }

        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 10;
            opacity: 0;
            transition: 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .hotspot:hover, .hotspot:active {
            opacity: 1;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
        }

        /* POSIÇÕES */
        #btn-cabelo { top: 20%; left: 35%; width: 30%; height: 30%; }
        .social-btn { bottom: 5%; width: 15%; height: 15%; }
        #youtube { left: 25%; }
        #instagram { left: 42%; }
        #github { left: 59%; }
    </style>
</head>
<body>

    <div class="container">
        <video id="video-feed" muted playsinline>
            <source src="seu-video.mp4" type="video/mp4">
        </video>

        <img src="logo.jpg" alt="Prof Sergio" class="img-base">

        <div class="hotspot" id="btn-cabelo" onclick="toggleVideo()"></div>

        <a href="https://www.youtube.com/@osergiopereira" target="_blank" class="hotspot social-btn" id="youtube"></a>
        <a href="https://www.instagram.com/prof.sergiopereira" target="_blank" class="hotspot social-btn" id="instagram"></a>
        <a href="https://github.com/profsergiopereira" target="_blank" class="hotspot social-btn" id="github"></a>
    </div>

    <script>
        const v = document.getElementById('video-feed');

        function toggleVideo() {
            if (v.style.display === 'none' || v.style.display === '') {
                v.style.display = 'block';
                v.currentTime = 0; // Garante que começa do início
                v.play();
            } else {
                fecharVideo();
            }
        }

        function fecharVideo() {
            v.pause();
            v.style.display = 'none';
            v.currentTime = 0;
        }
