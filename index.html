<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prof Sergio Educação Digital</title>
    <style>
        body { 
            margin: 0; padding: 0; background: #051622; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden;
        }

        .container { 
            position: relative; width: 90vw; max-width: 420px; 
        }
        
        /* Foto principal */
        .main-img { 
            width: 100%; border-radius: 20px; display: block; 
            position: relative; z-index: 10;
        }
        
        /* BOTÃO AGRINHO NO CANTO */
        .link-agrinho {
            position: absolute; top: -30px; right: -10px;
            z-index: 100; text-decoration: none;
        }

        .btn-agrinho {
            width: 100px; height: auto; display: block;
            animation: flutuar 3s ease-in-out infinite;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes flutuar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* VÍDEO OCULTO */
        #video-player {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 20px; object-fit: cover;
            display: none; z-index: 500; background: #000;
        }

        /* ÁREAS DE CLIQUE */
        .hotspot { 
            position: absolute; cursor: pointer; z-index: 50; 
            opacity: 0; -webkit-tap-highlight-color: transparent; 
        }

        #click-cabeca { top: 15%; left: 25%; width: 50%; height: 35%; }
        .social { bottom: 6%; width: 16%; height: 14%; }
        #link-yt { left: 22%; } 
        #link-ig { left: 42%; } 
        #link-gh { left: 62%; }

    </style>
</head>
<body>

    <div class="container">
        
        <a href="https://www.sistemafaep.org.br/agrinho/" target="_blank" class="link-agrinho">
            <img src="agrinho.png" class="btn-agrinho">
        </a>

        <img src="logo.jpg" class="main-img">

        <video id="video-player" playsinline muted>
            <source src="seu-video.mp4" type="video/mp4">
        </video>

        <div class="hotspot" id="click-cabeca" onclick="abrir()"></div>

        <a href="https://youtube.com/@osergiopereira" target="_blank" class="hotspot social" id="link-yt"></a>
        <a href="https://instagram.com/prof.sergiopereira" target="_blank" class="hotspot social" id="link-ig"></a>
        <a href="https://github.com/profsergiopereira" target="_blank" class="hotspot social" id="link-gh"></a>

    </div>

    <script>
        const v = document.getElementById('video-player');

        function abrir() {
            v.style.display = 'block';
            v.currentTime = 0;
            v.play();
        }

        function fechar() {
            v.pause();
            v.style.display = 'none';
        }

        // Fecha quando acaba
        v.onended = fechar;
        
        // Fecha com 1 clique no vídeo
        v.onclick = fechar;
