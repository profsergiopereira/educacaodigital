<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prof Sergio Educação Digital</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #051622;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .container {
            position: relative;
            max-width: 95vw;
            max-height: 95vh;
        }

        .img-base {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 90vh;
            border-radius: 15px;
            display: block;
        }

        #video-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            visibility: hidden; /* Usei visibility em vez de display para o navegador não "esquecer" o vídeo */
            z-index: 5;
        }

        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 50; /* Abaixo do vídeo para não atrapalhar o fim, mas acima da imagem */
            opacity: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* Botão da cabeça - Área de clique bem grande para não errar no celular */
        #btn-cabelo {
            top: 15%;
            left: 30%;
            width: 40%;
            height: 40%;
        }

        .social-btn {
            bottom: 5%;
            width: 15%;
            height: 15%;
        }
        #youtube { left: 25%; }
        #instagram { left: 42%; }
        #github { left: 59%; }
    </style>
</head>
<body>

    <div class="container">
        <video id="video-feed" muted playsinline preload="auto">
            <source src="seu-video.mp4" type="video/mp4">
        </video>
