<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prof Sergio Educação Digital</title>
    <style>
        body { margin: 0; background: #051622; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .container { position: relative; width: 90vw; max-width: 500px; }
        img { width: 100%; border-radius: 15px; display: block; }
        
        video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 15px; object-fit: cover;
            display: none; /* Começa escondido para não dar erro */
        }

        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 100;
            /* background: rgba(255,0,0,0.2);  <-- Descomente esta linha para ver onde o botão está se tiver dúvida */
        }

        /* Área de clique na cabeça */
        #btn-play { top: 15%; left: 25%; width: 50%; height: 40%; }

        /* Botões sociais embaixo */
        .social { bottom: 5%; width: 15%; height: 12%; }
        #yt { left: 22%; } #ig { left: 42%; } #gh { left: 62%; }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.jpg" id="foto">

        <video id="video" playsinline muted>
            <source src="seu-video.mp4" type="video/mp4">
        </video>

        <div class="hotspot" id="btn-play" onclick="começar()"></div>
        
        <a href="https://youtube.com/@osergiopereira" target="_blank" class="hotspot social" id="yt"></a>
        <a href="https://instagram.com/prof.sergiopereira" target="_blank" class="hotspot social" id="ig"></a>
        <a href="https://github.com/profsergiopereira" target="_blank" class="hotspot social" id="gh"></a>
    </div>

    <script>
        const v = document.getElementById('video');

        function começar() {
            v.style.display = 'block';
            v.play();
        }

        // Quando o vídeo termina, ele volta para a imagem
        v.onended = function() {
            fechar();
        };

        // Se clicar no vídeo enquanto ele passa, ele também fecha
        v.onclick = function() {
            fechar();
        };

        function fechar() {
            v.pause();
            v.currentTime = 0;
            v.style.display = 'none';
        }
    </script>

</body>
</html>
