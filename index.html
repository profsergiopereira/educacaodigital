<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prof Sergio Digital</title>
    <style>
        body { margin: 0; padding: 0; background: #051622; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .base { position: relative; width: 90vw; max-width: 420px; }
        .capa { width: 100%; border-radius: 20px; display: block; z-index: 1; }
        
        /* Botão Agrinho */
        .agrinho-btn {
            position: absolute; top: -30px; right: -10px;
            width: 110px; z-index: 1500; cursor: pointer;
            animation: bounce 3s ease-in-out infinite;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Player de Vídeo */
        #videoPrincipal {
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            width: 100%; height: auto; 
            max-height: 100vh; 
            border-radius: 15px; 
            object-fit: contain; 
            display: none; 
            z-index: 1000; /* Vídeo fica no meio */
            background: #000;
        }

        /* Área de toque da cabeça */
        #cabeca-click { 
            position: absolute; top: 15%; left: 25%; width: 50%; height: 35%; 
            z-index: 500; cursor: pointer; opacity: 0;
        }
        
        /* REDES SOCIAIS - Z-INDEX ALTO PARA FUNCIONAR SEMPRE */
        .social-link { 
            position: absolute; bottom: 6%; width: 16%; height: 14%; 
            z-index: 2000; /* Fica acima do vídeo e da imagem */
            cursor: pointer; 
            -webkit-tap-highlight-color: rgba(255,255,255,0.2); 
        }
        #yt { left: 22%; } #ig { left: 42%; } #gh { left: 62%; }
    </style>
</head>
<body>

    <div class="base">
        <img src="agrinho.png" id="agro" class="agrinho-btn" onclick="iniciarVideo('video-agrinho.mp4')">

        <img src="logo.jpg" class="capa">

        <video id="videoPrincipal" playsinline preload="auto"></video>

        <div id="cabeca-click" onclick="iniciarVideo('seu-video.mp4')"></div>

        <a href="https://youtube.com/@osergiopereira" target="_blank" class="social-link" id="yt"></a>
        <a href="https://instagram.com/prof.sergiopereira" target="_blank" class="social-link" id="ig"></a>
