<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prof Sergio Digital</title>
    <style>
        body { margin: 0; padding: 0; background: #051622; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .base { position: relative; width: 90vw; max-width: 420px; }
        .capa { width: 100%; border-radius: 20px; display: block; }
        
        .agrinho-touch {
            position: absolute; top: -30px; right: -10px;
            width: 110px; z-index: 999; cursor: pointer;
            animation: bounce 3s ease-in-out infinite;
            transition: opacity 0.5s ease; /* Para o efeito de aparecer suavemente */
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        #videoPrincipal {
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            width: 100%; height: auto; max-height: 100vh; 
            border-radius: 15px; object-fit: contain; 
            display: none; z-index: 1000; background: #000;
        }

        .toque { position: absolute; cursor: pointer; z-index: 50; opacity: 0; -webkit-tap-highlight-color: transparent; }
        #cabeca-btn { top: 15%; left: 25%; width: 50%; height: 35%; }
        .rede-btn { bottom: 6%; width: 16%; height: 14%; }
        #yt-btn { left: 22%; } #ig-btn { left: 42%; } #gh-btn { left: 62%; }
    </style>
</head>
<body>

        <img src="agrinho.png" id="agro" class="agrinho-touch" onclick="rodar('video-agrinho.mp4')">

        <video id="videoPrincipal" playsinline></video>

        <div class="toque" id="cabeca-btn" onclick="rodar('seu-video.mp4')"></div>

        <a href="https://github.com/profsergiopereira" target="_blank" class="toque rede-btn" id="gh-btn"></a>
    </div>
