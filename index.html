<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prof Sergio Educação Digital</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #051622; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; /* Trava a tela para não deslizar */
            position: fixed; /* Evita puxar para atualizar no mobile */
        }

        .interface-wrapper { 
            position: relative; 
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .img-base { 
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain; /* O segredo para não cortar em nenhuma tela */
            border-radius: 15px;
            z-index: 1; 
        }

        #video-feed { 
            position: absolute; 
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Vídeo segue a mesma regra da imagem */
            border-radius: 15px; 
            opacity: 0; 
            z-index: 10; 
            pointer-events: none; 
            transition: opacity 0.5s ease; 
        }

        .hotspot { 
            position: absolute; 
            cursor: pointer; 
            z-index: 100; 
            opacity: 0; 
            transition: opacity 0.6s; 
            outline: none; 
            -webkit-tap-highlight-color: transparent;
        }
        
        .hotspot:active { opacity: 1; } /* Brilho ao tocar no celular */

        /* Posições relativas ajustadas */
        #btn-cabelo { top: 25%; left: 40%; width: 20%; height: 20%; border-radius: 50%; background: radial-gradient(circle, rgba(255, 215, 0, 0.4) 0%, rgba(255, 215, 0, 0) 70%); }
        .social-btn { bottom: 8%; width: 10%; height: 10%; border-radius: 50%; }
        #youtube { left: 30%; } 
        #instagram { left: 45%; } 
        #github { left: 60%; }
    </style>
</head>
<body>
    <div class="interface-wrapper">
        <video id="video-feed" loop muted playsinline preload="auto">
            <source src="seu-video.mp4" type="video/mp4">
        </video>
        <img src="logo.jpg" alt="Prof Sergio" class="img-base">
        <div class="hotspot" id="btn-cabelo" onclick="controlarVideo()"></div>
        <a href="https://www.youtube.com/@osergiopereira" target="_blank" class="hotspot social-btn" id="youtube"></a>
        <a href="https://www.instagram.com/prof.sergiopereira" target="_blank" class="hotspot social-btn" id="instagram"></a>
        <a href="https://github.com/profsergiopereira" target="_blank" class="hotspot social-btn" id="github"></a>
    </div>
    <script>
        const video = document.getElementById('video-feed');
        function controlarVideo() {
            if (video.paused) {
                video.play().then(() => { video.style.opacity = "1"; }).catch(err => { console.log(err); });
            } else {
                video.style.opacity = "0";
                setTimeout(() => { video.pause(); }, 500);
            }
        }
    </script>
</body>
</html>
