<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prof Sergio Educação Digital</title>
    <style>
        /* Reset básico e fundo */
        body { 
            margin: 0; 
            padding: 0;
            background: #051622; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Container principal centralizado */
        .container { 
            position: relative; 
            width: 90vw; 
            max-width: 420px; /* Otimizado para telas mobile */
            line-height: 0;
        }
        
        /* Imagem do Prof Sergio */
        .main-img { 
            width: 100%; 
            border-radius: 20px; 
            display: block; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            z-index: 10;
        }
        
        /* --- BOTÃO POP-UP AGRINHO --- */
        .link-agrinho {
            position: absolute;
            top: -25px; /* Flutuando um pouco acima da borda */
            right: -10px;
            z-index: 500; /* Sempre no topo de tudo */
            text-decoration: none;
            display: block;
        }

        .btn-agrinho {
            width: 110px; /* Tamanho do ícone */
            height: auto;
            display: block !important;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.4));
            animation: flutuarPop 3s ease-in-out infinite;
            -webkit-tap-highlight-color: transparent;
        }

        /* Animação do Pop-up */
        @keyframes flutuarPop {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.08); }
        }
