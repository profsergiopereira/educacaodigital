<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prof Sergio Educação Digital</title>
    <style>
        body { 
            margin: 0; 
            background: #051622; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
        }

        .container { 
            position: relative; 
            width: 90vw; 
            max-width: 450px; 
        }
        
        .main-img { 
            width: 100%; 
            border-radius: 20px; 
            display: block; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        /* --- BOTÃO POP-UP AGRINHO --- */
        .btn-agrinho {
            position: absolute;
            top: -20px;
            right: -10px;
            width: 100px; /* Tamanho do ícone */
            z-index: 150;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: flutuarAgro 3s ease-in-out infinite;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-agrinho:active {
            transform: scale(0.9);
        }

        @keyframes flutuarAgro {
            0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3)); }
            50% { transform: translateY(-10px) scale(1.05); filter: drop-shadow(0 15px 20px rgba(0,0,0,0.5)); }
        }

        /* --- VÍDEO --- */
        video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 20px; 
            object-fit: cover;
