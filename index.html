<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prof Sergio Digital</title>
    <style>
        body { margin: 0; padding: 0; background: #051622; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .base { position: relative; width: 90vw; max-width: 420px; }
        .capa { width: 100%; border-radius: 20px; display: block; }
        
        /* BOTÃO AGRINHO */
        #agro {
            position: absolute; top: -30px; right: -10px;
            width: 110px; z-index: 100; cursor: pointer;
            animation: bounce 3s ease-in-out infinite;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* PLAYER */
        #videoPrincipal {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            width: 100%; height: auto; max-height: 100vh; 
            border-radius: 15px; display: none; z-index: 500; background: #000;
        }

        /* ÁREA DA CABEÇA */
        #cabeca-click { 
            position: absolute; top: 15%; left: 25%; width: 50%; height: 30%; 
            z-index: 50; cursor: pointer;
        }
        
        /* REDES SOCIAIS - Diminuí a altura para não bater no Agrinho */
        .social-link { 
            position: absolute; bottom: 5%; width: 18%; height: 12%; 
            z-index: 60; cursor: pointer; 
        }
        #yt { left: 20%; } #ig { left: 41%; } #gh { left: 62%; }
    </style>
</head>
<body>

    <div class="base">
        <img src="logo.jpg" class="capa">
        
        <img src="agrinho.png" id="agro">

        <video id="videoPrincipal" playsinline></video>

        <div id="cabeca-click"></div>

        <a href="https://youtube.com/@osergiopereira" target="_blank" class="social-link" id="yt"></a>
        <a href="https://instagram.com/prof.sergiopereira" target="_blank" class="social-link" id="ig"></a>
        <a href="https://github.com/profsergiopereira" target="_blank" class="social-link" id="gh"></a>
    </div>

    <script>
        const player = document.getElementById('videoPrincipal');
        const botaoAgro = document.getElementById('agro');
        const cabeca = document.getElementById('cabeca-click');

        function abrirVideo(nome) {
            botaoAgro.style.display = 'none';
            player.src = nome;
            player.style.display = 'block';
            player.muted = false;
            player.play().catch(() => {
                player.muted = true;
                player.play();
            });
        }

        function fechar() {
            player.pause();
            player.style.display = 'none';
            player.src = "";
            // Espera 1 minuto para voltar
            setTimeout(() => { botaoAgro.style.display = 'block'; }, 60000);
        }

        // Eventos de Clique (Mais modernos)
        botaoAgro.addEventListener('click', () => abrirVideo('video-agrinho.mp4'));
        cabeca.addEventListener('click', () => abrirVideo('seu-video.mp4'));
        player.addEventListener('click', fechar);
        player.onended = fechar;
    </script>

</body>
</html>
