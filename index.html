<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prof Sergio Educação Digital</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #051622;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            position: relative;
            line-height: 0;
            max-width: 95vw;
        }

        .img-base {
            width: 100%;
            height: auto;
            max-height: 90vh;
            border-radius: 15px;
            display: block;
        }

        #video-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            display: none; /* Começa escondido */
            z-index: 5;
        }

        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 100; /* Sempre no topo para o clique funcionar */
            opacity: 0;
            transition: 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .hotspot:hover, .hotspot:active {
            opacity: 1;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
        }

        /* AJUSTE DAS POSIÇÕES */
        #btn-cabelo {
            top: 20%;
            left: 35%;
            width: 30%;
            height: 30%;
        }

        .social-btn {
            bottom: 5%;
            width: 15%;
            height: 15%;
        }

        #youtube { left: 25%; }
        #instagram { left: 42%; }
        #github { left: 59%; }
    </style>
</head>
<body>

    <div class="container">
        <video id="video-feed" muted playsinline>
            <source src="seu-video.mp4" type="video/mp4">
        </video>

        <img src="logo.jpg" alt="Prof Sergio" class="img-base">

        <div class="hotspot" id="btn-cabelo" onclick="ligarVideo()"></div>
