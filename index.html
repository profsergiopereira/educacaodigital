<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prof Sergio Educação Digital</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #051622; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }
        .interface-wrapper { 
            position: relative; 
            height: 95vh; 
            display: inline-block; 
            background: #000; 
            border-radius: 20px; 
        }
        .img-base { 
            height: 100%; 
            width: auto; 
            display: block; 
            border-radius: 20px; 
            position: relative; 
            z-index: 1; 
        }
        #video-feed { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            border-radius: 20px; 
            opacity: 0; 
            z-index: 10; 
            pointer-events: none; 
            transition: opacity 0.5s ease; 
        }
        .hotspot { 
            position: absolute; 
            cursor: pointer; 
            z-index: 100; 
            opacity: 0; 
            transition: opacity 0.6s, box-shadow 0.6s; 
            outline: none; 
        }
        .hotspot:hover { opacity: 1; }
        
        /* Ajustes das áreas de clique */
        #btn-cabelo { 
            top: 28%; left: 48%; width: 19%; height: 21%; border-radius: 50%; 
            background: radial-gradient(circle, rgba(255, 215, 0, 0.4) 0%, rgba(255, 215, 0, 0) 70%); 
            box-shadow: 0 0 35px gold; 
        }
        .social-btn { 
            bottom: 6%; width: 8%; height: 10%; border-radius: 50%; 
            background: rgba(255,255,255,0.2); 
        }
        #youtube { left: 31%; } 
        #instagram { left: 46%; } 
        #github { left: 61%; }
    </style>
</head>
<body>
    <div class="interface-wrapper">
        <video id="video-feed" loop muted playsinline preload="auto">
            <source src="seu-video.mp4" type="video/mp4">
        </video>

        <img src="logo.jpg" alt="Prof Sergio" class="img-base">

        <div class="hotspot" id="btn-cabelo" onclick="controlarVideo()" title="esse será meu feed mental, atualizado sempre que possivel e necessário"></div>

        <a href="https://www.youtube.com/@osergiopereira" target="_blank" class="hotspot social-btn" id="youtube" title="YouTube"></a>
        <a href="https://www.instagram.com/prof.sergiopereira" target="_blank" class="hotspot social-btn" id="instagram" title="Instagram"></a>
        <a href="https://github.com/profsergiopereira" target="_blank" class="hotspot social-btn" id="github" title="GitHub"></a>
    </div>

    <script>
        const video = document.getElementById('video-feed');
        function controlarVideo() {
            if (video.paused) {
                video.play().then(() => { 
                    video.style.opacity = "1"; 
                }).catch(err => { 
                    console.log("Erro ao iniciar vídeo:", err); 
                });
            } else {
                video.style.opacity = "0";
                setTimeout(() => { video.pause(); }, 500);
            }
        }
    </script>
</body>
</html>
