<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prof Sergio</title>
    <style>
        body { margin: 0; padding: 0; background: #051622; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .base { position: relative; width: 90vw; max-width: 420px; }
        .capa { width: 100%; border-radius: 20px; display: block; }
        .agrinho-btn { position: absolute; top: -30px; right: -10px; width: 110px; z-index: 999; cursor: pointer; animation: bounce 3s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        #player { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; height: auto; border-radius: 15px; display: none; z-index: 1000; background: #000; }
        .click { position: absolute; cursor: pointer; z-index: 50; opacity: 0; }
        #cabeca { top: 15%; left: 25%; width: 50%; height: 35%; }
    </style>
</head>
<body>
    <div class="base">
        <img src="agrinho.png" id="agro" class="agrinho-btn" onclick="abrir('video-agrinho.mp4')">
        <img src="logo.jpg" class="capa">
        <video id="player" playsinline></video>
        <div class="click" id="cabeca" onclick="abrir('seu-video.mp4')"></div>
    </div>

    <script>
        const p = document.getElementById('player');
        const a = document.getElementById('agro');

        function abrir(vid) {
            p.src = vid;
            p.style.display = 'block';
            a.style.display = 'none'; // Some na hora
            p.muted = false;
            p.play();
        }

        function fechar() {
            p.pause();
            p.style.display = 'none';
            p.src = "";
            // Espera 1 minuto para voltar o botão
            setTimeout(() => { a.style.display = 'block'; }, 60000);
        }

        p.onclick = fechar;
        p.onended = fechar;
    </script>
</body>
</html>
